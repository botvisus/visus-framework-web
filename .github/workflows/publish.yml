name: Publish to PyPI

# Publishes to PyPI when you cut a GitHub Release (tag vX.Y.Z).
#
# A plain `git push` does NOT publish. Neither does `workflow_dispatch`: EVERY job
# below is guarded, so a manual run from the Actions tab — on any branch — builds
# nothing and publishes nothing. The dispatch trigger is kept only so the guard
# stays visible and testable.
#
# The guard has two halves:
#   github.event_name == 'release'                     -> not a dispatch
#   github.event.release.target_commitish == 'main'    -> cut from main
#
# It is `target_commitish`, NOT `github.ref`: on a release event GITHUB_REF is the
# TAG ref (refs/tags/vX.Y.Z), so `github.ref == 'refs/heads/main'` is never true
# and would silently block every release. `target_commitish` carries the branch
# the release was created from.
#
# Caveat: if a Release is cut from a pre-existing tag rather than a branch, GitHub
# sets target_commitish to a commit SHA and this guard rejects it. Cut releases
# from the `main` branch, as RELEASING.md describes.
#
# Nothing is built until the full CI matrix (lint, types, unit, packaging and the
# real-browser suite with both coverage gates) is green on the released commit.
#
# Auth is via PyPI Trusted Publishing (OIDC): no tokens, no secrets.

on:
  release:
    types: [published]
  workflow_dispatch: # deliberately inert — see the guard on every job

permissions:
  contents: read

jobs:
  test:
    name: CI gates
    if: github.event_name == 'release' &&
        github.event.release.target_commitish == 'main'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    if: github.event_name == 'release' &&
        github.event.release.target_commitish == 'main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # `twine check` validates metadata and never opens the wheel's payload.
      # The agent skill and the Selenium JS bundle both live inside the package
      # directory, so a packaging regression would silently ship a CLI that
      # cannot install its own skill or drive a browser.
      - name: Assert the wheel ships the agent skill and the runtime data files
        run: |
          python - "$(ls dist/*.whl)" <<'PY'
          import sys, zipfile
          wheel = sys.argv[1]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "visus/web/skills/visus-web/SKILL.md",
              "visus/web/backends/selenium/js/bundle.js",
              "visus/web/py.typed",
          ]
          print(f"{wheel}: {len(names)} entries")
          for item in required:
              print(("  OK   " if item in names else "  MISS ") + item)
          missing = [item for item in required if item not in names]
          if missing:
              sys.exit(f"wheel is missing required files: {missing}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' &&
        github.event.release.target_commitish == 'main'
    needs: [build]
    runs-on: ubuntu-latest
    # The environment name MUST match what you set on PyPI's trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/visus-web
    permissions:
      id-token: write # required for OIDC / trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
