<!doctype html>
<html><head><meta charset="utf-8"><title>reCAPTCHA v3</title>
  <!-- O v3 se declara pelo render=<chave>; o script não carrega offline, então um
       grecaptcha de mentira faz o papel da biblioteca do Google -->
  <script src="http://127.0.0.1:9/recaptcha/api.js?render=6Le-test-v3-sitekey" async></script>
  <script>
    window.grecaptcha = { ready: (fn) => fn(), execute: () => Promise.resolve("REAL-GOOGLE-TOKEN") };
  </script>
</head>
<body>
  <button id="send" type="button" onclick="send()">Send</button>
  <p id="status">waiting</p>
  <script>
    function send() {
      grecaptcha.execute("6Le-test-v3-sitekey", { action: "submit" }).then((token) => {
        document.getElementById("status").textContent = "sent:" + token;
      });
    }
  </script>
</body></html>
