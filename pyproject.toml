[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visus-web"
version = "0.2.0"
description = "Modern, Playwright-style web automation on a pure Selenium engine, with BotCity RPA reach."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Matheus Pereira" }]
keywords = [
    "browser-automation",
    "selenium",
    "web-testing",
    "rpa",
    "playwright-style",
    "locators",
    "mcp",
    "agent-skill",
    "ocr",
    "captcha",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Typing :: Typed",
]
dependencies = ["selenium>=4.38,<5"]

[project.urls]
Homepage = "https://github.com/botvisus/visus-framework-web"
Repository = "https://github.com/botvisus/visus-framework-web.git"
"Bug Tracker" = "https://github.com/botvisus/visus-framework-web/issues"

[project.optional-dependencies]
# Every requirement below carries an upper bound. `mcp>=1.2.0` once did not, mcp
# 2.0.0 removed `mcp.server.fastmcp`, and `pip install "visus-web[mcp]"` shipped a
# server that could not import — with no change to this repo. Guarded by
# tests/test_repo_metadata.py.
dev = [
    "pytest>=7.0.0,<10",
    "pytest-cov>=4.0.0,<8",
    "pytest-xdist>=3.5.0,<4",
    "pytest-timeout>=2.2.0,<3",
    "pytest-asyncio>=0.23.0,<2",
    "ruff>=0.6.0,<1",
    "mypy>=1.8.0,<3",
    "pre-commit>=3.5.0,<5",
    'tomli>=2.0,<3; python_version < "3.11"',
    # [tool.coverage.report] exclude_also needs coverage >= 7.2.0; on anything
    # older the key is silently ignored and TYPE_CHECKING blocks count as missed.
    "coverage[toml]>=7.2.0,<8",
    # tests/test_installed_entry_points.py builds the real wheel with
    # `python -m build --no-isolation`, which needs the backend present locally.
    "build>=1.0.0,<2",
    "hatchling>=1.21.0,<2",
    # tests/test_ci_workflows.py asserts the workflow contracts structurally.
    "pyyaml>=6.0,<7",
]
vision = [
    "rapidocr-onnxruntime>=1.3.0,<2",
    "opencv-python>=4.8.0,<6",
    "pillow>=10.0.0,<13",
    # <2.5: numpy 2.5's stubs use PEP 695 `type` statements, which mypy rejects as a
    # syntax error under python_version = "3.10" — it then stops before checking any
    # of our code, so the gate passes vacuously.
    "numpy>=1.24.0,<2.5",
]
mcp = [
    # <2: mcp 2.0.0 removed `mcp.server.fastmcp`, imported by mcp/server.py.
    "mcp>=1.2.0,<2",
]
cli = [
    "typer>=0.12.0,<1",
    # Imported directly by cli/main.py and cli/console.py — Typer happens to pull it
    # in today, but that is transitive and could stop being true.
    "rich>=13,<16",
    # 8.2 is the first click that keeps CliRunner's stderr separate from stdout
    # (the drift-warning tests assert on result.stderr) and the version whose
    # long-option parsing `--skills=agents` is pinned against.
    "click>=8.2.0,<9",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
visus = "visus.web.cli._entry:cli_main"
visus-web-mcp = "visus.web.cli._entry:mcp_main"

[project.entry-points.pytest11]
visus_web = "visus.web.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/visus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: integration test that launches a real headless browser",
    "packaging: builds the real wheel and installs it into a temp venv (needs network)",
]
timeout = 60
asyncio_mode = "auto"
# -p no:visus_web: our own pytest11 entry point would import visus.web BEFORE
# pytest-cov starts measuring, zeroing out import-time coverage. The plugin is
# still exercised explicitly by tests/test_pytest_plugin.py (pytester sessions).
# No --cov-fail-under here: a filtered lane (-m "not browser" selects 623 of 921
# tests) can never reach 90% and would fail on arrival. Measurement stays on;
# the gate is passed explicitly by whoever enforces it (TESTING.md, CI) and
# waived with --cov-fail-under=0 by whoever cannot.
addopts = "-p no:visus_web -n auto --dist loadfile --strict-markers --strict-config --cov=visus.web --cov-report=term-missing"
# pytest's OWN warnings are defects in this repo, so they are fatal. A blanket
# `error` is NOT used: selenium/urllib3/onnxruntime deprecations would fail
# tests across the suite for reasons this repo cannot fix.
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
    "error::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["visus.web"]
branch = false

[tool.coverage.report]
# THE global gate. One number, one place: pytest-cov adopts it when
# --cov-fail-under is absent, `coverage report` honours it, and
# scripts/check_coverage.py reads it as the global floor.
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long lines in CSS/HTML/JS string literals are unavoidable
"src/visus/web/observability/report.py" = ["E501"]
"src/visus/web/backends/selenium/driver_delegate.py" = ["E501"]
"src/visus/web/tracing.py" = ["E501"]
# Demo script embeds raw HTML/JS strings; long lines are unavoidable
"examples/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["visus.web"]
strict = true

[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*", "cv2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# Imported lazily and optionally by rpa.py: the import is guarded by
# RUNPILOT_RUN_TOKEN and wrapped in try/except, and visus.web never hard-depends on
# it — so it is deliberately absent from [project.optional-dependencies].
[[tool.mypy.overrides]]
module = ["runpilot.*"]
ignore_missing_imports = true
