<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Cópias escondidas</title></head>
<body>
  <!-- Mesmo botão duas vezes: a cópia escondida vem PRIMEIRO no DOM, como em menus
       responsivos e modais fechados. Um localizador por papel+nome casa as duas. -->
  <div style="display:none"><button onclick="salvar('escondido')">Salvar</button></div>
  <button onclick="salvar('visível')">Salvar</button>
  <p id="res">nada</p>
  <script>function salvar(quem) { document.getElementById('res').textContent = 'salvo pelo ' + quem }</script>
</body>
</html>
